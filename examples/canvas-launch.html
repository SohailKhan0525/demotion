<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launch title study · Demotion</title>
  <style>
    :root { color-scheme: light; font: 100%/1.45 system-ui, sans-serif; color: #0d0e12; background: #f2f0ea; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(100% - 2rem, 58rem); margin: clamp(1rem, 4vw, 3rem) auto; }
    h1 { font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.055em; line-height: 1; margin: 0 0 .7rem; }
    p { margin: 0 0 1.25rem; }
    canvas { display: block; width: 100%; height: auto; background: #0d0e12; }
    .controls { display: flex; flex-wrap: wrap; align-items: end; gap: .8rem 1rem; margin-top: 1rem; }
    label { display: grid; gap: .25rem; font-weight: 600; font-size: .88rem; }
    .title { flex: 1 1 12rem; }
    input, select, button { font: inherit; color: inherit; }
    input[type=text], select, button { min-height: 2.65rem; padding: .45rem .8rem; border: 1px solid #0d0e12; border-radius: .25rem; background: transparent; }
    button { cursor: pointer; }
    #play { background: #0d0e12; color: #f2f0ea; min-width: 5.5rem; }
    :focus-visible { outline: 3px solid #2b3cff; outline-offset: 3px; }
    .seek { margin-top: 1rem; }
    .seek span { display: flex; justify-content: space-between; gap: 1rem; }
    #position { margin: 0; width: 100%; min-height: 2rem; accent-color: #2b3cff; }
    #time { font: 0.875rem ui-monospace, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Launch title study</h1>
    <p>Edit the title, then play or scrub from the first draft to the final card.</p>
    <canvas id="screen" width="960" height="540" role="img" aria-label="Animated title preview">Title preview of a twelve-beat launch sequence.</canvas>
    <div class="controls">
      <label class="title">Title <input id="title" type="text" value="On cue" maxlength="24"></label>
      <label>Tempo <select id="tempo">
        <option value="90">90 BPM</option><option value="120" selected>120 BPM</option><option value="150">150 BPM</option>
      </select></label>
      <button id="play" type="button">Play</button>
      <button id="save" type="button">Save frame</button>
    </div>
    <label class="seek" for="position"><span>Playhead <span id="time" aria-hidden="true">0.0 / 6.0 s</span></span></label>
    <input id="position" type="range" min="0" max="12" step="0.01" value="0">
    <noscript>Enable JavaScript to draw and edit the preview.</noscript>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    const canvas = byId('screen'), ctx = canvas.getContext('2d');
    const title = byId('title'), tempo = byId('tempo'), position = byId('position'), play = byId('play');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)');
    const ink = '#0D0E12', paper = '#F2F0EA', blue = '#2B3CFF', lime = '#D4FF3A';
    const stages = ['Set the title', 'Time the entrance', 'Final card'];
    const beats = 12;
    let beat = 0, playing = false, lastTime = 0, frame = 0;

    function label(text, x, y, color) {
      ctx.fillStyle = color;
      ctx.font = '20px ui-monospace, monospace';
      ctx.fillText(text, x, y);
    }

    function draw() {
      const stage = Math.min(2, Math.floor(beat / 4));
      const final = stage === 2, foreground = final ? ink : paper;
      const text = title.value.trim() || 'Untitled';
      ctx.fillStyle = final ? lime : stage === 1 ? blue : ink;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      label('DEMOTION', 48, 64, foreground);
      label(stages[stage], 676, 64, foreground);

      // Three offset copies show the entrance timing. The last act resolves to one title.
      const family = stage === 0 ? 'ui-monospace, monospace' : 'system-ui, sans-serif';
      const maxSize = stage === 0 ? 110 : 150;
      ctx.font = 'bold ' + maxSize + 'px ' + family;
      const maxWidth = stage === 1 ? 792 : 840;
      const fontSize = maxSize * Math.min(1, maxWidth / Math.max(1, ctx.measureText(text).width));
      ctx.font = 'bold ' + fontSize + 'px ' + family;
      if (stage === 1 && !reduced.matches) {
        const offset = 24 * Math.exp(-1.2 * (beat - 4));
        ctx.strokeStyle = lime;
        ctx.lineWidth = 1.5;
        for (let copy = 1; copy <= 3; copy++) ctx.strokeText(text, 48 + copy * offset, 310 - copy * offset);
      }
      ctx.fillStyle = foreground;
      ctx.fillText(text, 48, 310);
      if (stage === 0) {
        // The draft keeps its editing caret until the title moves onto the beat grid.
        ctx.fillStyle = lime;
        ctx.fillRect(58 + ctx.measureText(text).width, 312 - fontSize * .8, 5, fontSize * .85);
      }

      const active = Math.min(beats - 1, Math.floor(beat));
      for (let i = 0; i < beats; i++) {
        const x = 48 + i * 72;
        ctx.globalAlpha = i <= active ? 1 : .25;
        ctx.fillStyle = !final && i === active ? lime : foreground;
        ctx.fillRect(x, 416, 62, i === active ? 24 : 8);
        ctx.globalAlpha = 1;
      }
      label('BEAT ' + String(active + 1).padStart(2, '0') + ' / 12', 48, 488, foreground);
      label(tempo.value + ' BPM', 816, 488, foreground);
      position.value = String(beat);
      const elapsed = (beat * 60 / Number(tempo.value)).toFixed(1);
      byId('time').textContent = elapsed + ' / ' + (beats * 60 / Number(tempo.value)).toFixed(1) + ' s';
      position.setAttribute('aria-valuetext', stages[stage] + ', ' + elapsed + ' seconds');
      canvas.setAttribute('aria-label', stages[stage] + ': ' + text + ', beat ' + (active + 1) + ' of 12');
    }

    function stop() {
      playing = false;
      cancelAnimationFrame(frame);
      play.textContent = beat >= beats ? 'Replay' : 'Play';
    }

    function tick(now) {
      beat = Math.min(beats, beat + (now - lastTime) * Number(tempo.value) / 60000);
      lastTime = now;
      draw();
      if (beat < beats) frame = requestAnimationFrame(tick);
      else stop();
    }

    play.addEventListener('click', () => {
      if (playing) { stop(); return; }
      if (beat === beats) beat = 0;
      playing = true;
      lastTime = performance.now();
      play.textContent = 'Pause';
      frame = requestAnimationFrame(tick);
    });
    position.addEventListener('input', () => { beat = Number(position.value); stop(); draw(); });
    title.addEventListener('input', draw);
    tempo.addEventListener('change', draw);
    reduced.addEventListener('change', draw);
    document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
    byId('save').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'demotion-launch-frame.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
    draw();
  </script>
</body>
</html>
