name: First npm release
on:
  push:
    branches: [main]
    paths: [.github/workflows/first-release.yml]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Verify the intended public package
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          assert.equal(pkg.name, '@demotion/cli');
          assert.equal(pkg.version, '0.1.0');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.provenance, false);
          JS
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify the npm publishing account
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_SECRET must be configured as a GitHub Actions secret for this repository."
            exit 1
          fi
          if ! publisher="$(npm whoami --registry=https://registry.npmjs.org/)"; then
            echo "::error::The npm account check failed using NPM_SECRET. Check the token status and registry access."
            exit 1
          fi
          if [ "$publisher" != "qofeno-labs" ]; then
            echo "::error::NPM_SECRET does not authenticate as the requested qofeno-labs account."
            exit 1
          fi
          echo "Verified npm account: qofeno-labs"
      - name: Inspect publication state without publishing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
        run: |
          node - <<'JS'
          const {spawnSync} = require('node:child_process');
          const query = (args) => spawnSync('npm', args, {encoding: 'utf8'});
          const dry = query(['config', 'get', 'dry-run']);
          console.log(`::notice::npm dry-run setting: ${dry.stdout.trim() === 'true' ? 'true' : 'false'}`);
          const r = query(['view', '@demotion/cli@0.1.0', '--json', '--prefer-online', '--registry=https://registry.npmjs.org/']);
          let data;
          try { data = JSON.parse(r.stdout || '{}'); } catch { data = {}; }
          if (r.status === 0) {
            console.log(`::notice::Authenticated registry: name=${data.name}; version=${data.version}; publisher=${data._npmUser?.name}; provenance=${Boolean(data.dist?.attestations?.provenance)}`);
          } else {
            console.log(`::notice::Authenticated registry lookup failed: ${data.error?.code || 'UNKNOWN'}`);
          }
          const a = query(['access', 'get', 'status', '@demotion/cli', '--json', '--registry=https://registry.npmjs.org/']);
          let access;
          try { access = JSON.parse(a.stdout || '{}'); } catch { access = {}; }
          console.log(`::notice::Package access: ${a.status === 0 ? access['@demotion/cli'] || 'unknown' : access.error?.code || 'lookup failed'}`);
          JS
