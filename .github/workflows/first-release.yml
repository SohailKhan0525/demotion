name: First npm release
on:
  push:
    branches: [main]
    paths: [.github/workflows/first-release.yml]
  workflow_dispatch:

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org/
      - name: Verify the intended public package
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const pkg = require('./package.json');
          assert.equal(pkg.name, '@qofeno-labs/demotion');
          assert.equal(pkg.version, '0.1.0');
          assert.equal(pkg.publishConfig.access, 'public');
          assert.equal(pkg.publishConfig.provenance, false);
          JS
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify the npm publishing account
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_SECRET must be configured as a GitHub Actions secret for this repository."
            exit 1
          fi
          if ! publisher="$(npm whoami --registry=https://registry.npmjs.org/)"; then
            echo "::error::The npm account check failed using NPM_SECRET. Check the token status and registry access."
            exit 1
          fi
          if [ "$publisher" != "qofeno-labs" ]; then
            echo "::error::NPM_SECRET does not authenticate as the requested qofeno-labs account."
            exit 1
          fi
          echo "Verified npm account: qofeno-labs"
      - name: Check whether the version already exists
        id: registry
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          (async () => {
            const r = await fetch('https://registry.npmjs.org/@qofeno-labs%2Fdemotion/0.1.0', {cache: 'no-store'});
            if (r.status === 404) {
              fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=false\n');
              return;
            }
            if (!r.ok) throw new Error(`Registry preflight HTTP ${r.status}`);
            const data = await r.json();
            if (data.name !== '@qofeno-labs/demotion' || data.version !== '0.1.0' || data._npmUser?.name !== 'qofeno-labs') {
              throw new Error('Existing publication does not match the expected personal account');
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=true\n');
          })().catch((e) => { console.error(`::error::${e.message}`); process.exit(1); });
          JS
      - name: Publish demotion 0.1.0 without provenance
        if: steps.registry.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
        run: |
          node - <<'JS'
          const {spawnSync} = require('node:child_process');
          const fs = require('node:fs');
          const path = require('node:path');
          const r = spawnSync('npm', ['publish', '--access', 'public', '--provenance=false', '--registry=https://registry.npmjs.org/'], {encoding: 'utf8'});
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'demotion-publish.log'), (r.stdout || '') + (r.stderr || ''));
          if (r.status !== 0) {
            const code = (r.stderr || '').match(/npm (?:error|ERR!) code ([A-Z0-9_]+)/)?.[1] || 'UNKNOWN';
            let detail = (r.stderr || '').split('\n').filter((line) => /^npm (?:error|ERR!) 403\b/.test(line)).join(' ');
            const token = process.env.NODE_AUTH_TOKEN;
            if (token) detail = detail.split(token).join('[redacted]');
            detail = detail.replace(/https?:\/\/\S+/g, '[registry URL]').replace(/npm_[A-Za-z0-9]+/g, '[redacted]').slice(0, 1600);
            console.error(`::error::npm publication failed (${code}). No successful publication is claimed.`);
            if (detail) console.error(`::error::Registry refusal: ${detail}`);
            process.exit(r.status || 1);
          }
          console.log('npm publish completed successfully');
          JS
      - name: Verify registry version, publisher and provenance policy
        id: published
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          (async () => {
            let pkg;
            for (let attempt = 0; attempt < 12; attempt++) {
              const r = await fetch('https://registry.npmjs.org/@qofeno-labs%2Fdemotion/0.1.0', {cache: 'no-store'});
              if (r.ok) { pkg = await r.json(); break; }
              if (r.status !== 404) throw new Error(`Registry verification HTTP ${r.status}`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
            assert.ok(pkg, 'Published version is not yet visible');
            assert.equal(pkg.name, '@qofeno-labs/demotion');
            assert.equal(pkg.version, '0.1.0');
            assert.equal(pkg._npmUser.name, 'qofeno-labs');
            assert.ok(!pkg.dist?.attestations?.provenance, 'Unexpected provenance attestation');
            assert.match(pkg.gitHead, /^[a-f0-9]{40}$/);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `git_head=${pkg.gitHead}\n`);
            console.log('Verified @qofeno-labs/demotion@0.1.0, publisher qofeno-labs, no provenance');
          })().catch((e) => { console.error(`::error::${e.message}`); process.exit(1); });
          JS
      - name: Record the actual published source tag
        env:
          PUBLISHED_COMMIT: ${{ steps.published.outputs.git_head }}
        run: |
          git cat-file -e "$PUBLISHED_COMMIT^{commit}"
          if git rev-parse --verify --quiet refs/tags/v0.1.0 > /dev/null; then
            test "$(git rev-parse 'refs/tags/v0.1.0^{commit}')" = "$PUBLISHED_COMMIT"
            echo "v0.1.0 already identifies the actual published source."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.1.0 "$PUBLISHED_COMMIT" -m 'demotion 0.1.0'
            git push origin refs/tags/v0.1.0
          fi
