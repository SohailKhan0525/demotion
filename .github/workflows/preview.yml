name: Film previews

on:
  push:
    branches: [main]
    paths: &preview-paths
      - 'src/**'
      - '!src/audio/**'
      - '!src/lab/**'
      - '!src/lib*.ts'
      - 'public/fonts/**.woff2'
      - 'package*.json'
      - 'examples/canvas-launch.html'
      - 'scripts/preview-films.ts'
      - '.github/workflows/preview.yml'
  pull_request:
    branches: [main]
    paths: *preview-paths

permissions:
  contents: read

concurrency:
  group: film-previews-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prepare Chromium and FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          npx --no-install remotion browser ensure
      - name: Render every shot and license card
        run: |
          npx --no-install esbuild scripts/preview-films.ts --bundle --platform=node --packages=external --format=esm --outfile=out/preview-films.mjs
          node out/preview-films.mjs
      - name: Open the standalone canvas example
        run: |
          page="file://$GITHUB_WORKSPACE/examples/canvas-launch.html"
          chrome=(google-chrome --headless --disable-gpu --disable-background-networking --window-size=1100,960 "--user-data-dir=$RUNNER_TEMP/canvas-chrome")
          "${chrome[@]}" --dump-dom "$page" > "$RUNNER_TEMP/canvas-dom.html"
          # The draw function sets this accessible text after painting the canvas.
          grep -q 'aria-valuetext="' "$RUNNER_TEMP/canvas-dom.html"
          "${chrome[@]}" --screenshot="$PWD/out/film-previews/canvas-launch.png" "$page"
          test -s out/film-previews/canvas-launch.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: film-previews
          path: out/film-previews/
          if-no-files-found: error
          retention-days: 3
