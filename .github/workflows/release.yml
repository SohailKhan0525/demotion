name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the next version to npm (owner release decision)
        type: boolean
        required: true
        default: false

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: inputs.publish && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Require the manually published first release
        run: |
          if ! git rev-parse --verify --quiet refs/tags/v0.1.0 > /dev/null; then
            echo "::error::Publish 0.1.0 manually and push its v0.1.0 source tag first. See docs/PUBLISHING.md."
            exit 1
          fi
          published_version="$(npm view demotion@0.1.0 version --registry=https://registry.npmjs.org/)"
          if [ "$published_version" != "0.1.0" ]; then
            echo "::error::The manual demotion@0.1.0 publication is not available in the public registry."
            exit 1
          fi
      - name: Check publishing credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_SECRET || secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Add the NPM_SECRET repository secret before dispatching a release."
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Publish with semantic-release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_SECRET || secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
