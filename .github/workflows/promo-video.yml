name: Promo film

on:
  push:
    tags: [promo-launch]
  workflow_dispatch:

concurrency:
  group: promo-film
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: promo-launch
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run build && npm test
      - name: Prepare browser and encoder
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          npx --no-install remotion browser ensure
      - name: Render immutable film source
        run: npm run render:promo
        env:
          DEMOTION_WORKERS: "2"
          DEMOTION_CONCURRENCY: "1"
      - name: Verify delivery
        run: |
          npm run check:promo
          cd out/promo
          sha256sum --check SHA256SUMS
      - name: Publish downloadable film
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view promo-launch > /dev/null 2>&1; then
            gh release create promo-launch --verify-tag --prerelease --latest=false \
              --title "demotion: Ideas deserve motion" \
              --notes-file docs/promo/release-notes.md
          fi
          gh release upload promo-launch out/promo/demotion-promo-launch.mp4 \
            out/promo/poster.png out/promo/SHA256SUMS --clobber
