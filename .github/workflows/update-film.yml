name: Update film

on:
  push:
    tags: [update-030]
  workflow_dispatch:

concurrency:
  group: update-film-030
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  film:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: update-030
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint && npm run build && npm test
      - name: Prepare browser and encoder
        run: |
          if ! command -v ffmpeg > /dev/null || ! command -v ffprobe > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          npx --no-install remotion browser ensure
      - name: Render immutable film source
        run: npm run render:update
        env:
          DEMOTION_WORKERS: "2"
          DEMOTION_CONCURRENCY: "1"
      - name: Verify delivery
        run: |
          npm run check:update
          cd out/update-film
          sha256sum --check SHA256SUMS
      - name: Publish downloadable film
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view update-030 > /dev/null 2>&1; then
            gh release create update-030 --verify-tag --prerelease --latest=false \
              --title "demotion 0.3: Draw it. Give it depth." \
              --notes-file docs/update-film/release-notes.md
          fi
          gh release upload update-030 out/update-film/demotion-update-030.mp4 \
            out/update-film/poster.png out/update-film/SHA256SUMS --clobber
